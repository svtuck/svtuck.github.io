<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twist Tactics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>

/* Layout: the cube stage leads on the left, a control rail (status, net, face turns, log) sits right; stacks to one column under 880px. */
:root {
  --bg: #e6e9ee;
  --surface: #f5f6f8;
  --fg: #1a1e26;
  --muted: #5a616d;
  --line: #cdd2da;
  --x: #2545c4;
  --o: #c8601a;
  --win: #e7b416;
  --tile: #f3f0e8;
  --tile-hi: #cdd8ff;
  --tile-hint: #ffdf9e;
  --cube-body: #1c1f25;
  --stage-a: #f4f6f9;
  --stage-b: #d9dee6;
  --focus: #2545c4;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1a1d23; --fg: #e6e8ed; --muted: #9ba2ae; --line: #2c3039;
    --x: #8299ff; --o: #ff9c52; --win: #f0c43c; --tile: #2a2e37; --tile-hi: #3a4675; --tile-hint: #5c4a1f;
    --cube-body: #2c3039; --stage-a: #1e2229; --stage-b: #0f1115; --focus: #8299ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1a1d23; --fg: #e6e8ed; --muted: #9ba2ae; --line: #2c3039;
  --x: #8299ff; --o: #ff9c52; --win: #f0c43c; --tile: #2a2e37; --tile-hi: #3a4675; --tile-hint: #5c4a1f;
  --cube-body: #2c3039; --stage-a: #1e2229; --stage-b: #0f1115; --focus: #8299ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); }
.wrap {
  max-width: 1200px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font: 700 clamp(26px, 4.4vw, 40px)/1.05 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font: 600 12px/1 var(--font-body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); margin: 0 0 10px; }
h3 { font: 600 17px/1.3 var(--font-display); margin: 0 0 10px; letter-spacing: -0.01em; }

.game { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 880px) { .game { grid-template-columns: minmax(0, 1fr); } }

.stage {
  position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 680px; max-width: 100%;
  border-radius: 18px; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 35%, var(--stage-a), var(--stage-b));
  border: 1px solid var(--line);
}
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.stage canvas.dragging { cursor: grabbing; }
.stage canvas.pointing { cursor: pointer; }
.hint { position: absolute; left: 14px; top: 12px; font: 12px/1.3 var(--font-body); color: var(--muted); pointer-events: none; }
.view-btn { position: absolute; right: 12px; top: 10px; }
.banner {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  width: min(92%, 420px); background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18);
}
.banner .big { font: 700 30px/1 var(--font-display); }
.banner .txt { flex: 1; min-width: 0; }
.banner .txt strong { display: block; font: 600 16px/1.25 var(--font-display); }
.banner .txt span { color: var(--muted); font-size: 13px; }

.rail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-width: 0; }

.status { display: flex; align-items: center; gap: 14px; }
.chip { width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font: 700 26px/1 var(--font-display); background: var(--tile); flex: none; }
.chip.p1 { color: var(--x); box-shadow: inset 0 0 0 2px var(--x); }
.chip.p2 { color: var(--o); box-shadow: inset 0 0 0 2px var(--o); }
.status .who { font: 600 18px/1.2 var(--font-display); }
.status .sub { color: var(--muted); font-size: 13px; }
.status-text { min-width: 0; }
.steps { display: flex; gap: 6px; margin-top: 12px; }
.step { flex: 1; font: 500 12px/1 var(--font-body); padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); text-align: center; }
.step.on { border-color: var(--fg); color: var(--fg); background: var(--bg); }
.step.done { color: var(--muted); text-decoration: line-through; }

.controls-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; background: transparent; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
button, select {
  font: 500 13px/1 var(--font-body); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; cursor: pointer;
}
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .38; cursor: not-allowed; }
button:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.score { display: flex; gap: 14px; margin-left: auto; font: 500 13px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.score b { color: var(--fg); font-weight: 500; }

/* Net: unfolded cube, clickable */
.net { --cs: clamp(17px, 5.6vw, 30px); display: grid; grid-template-columns: repeat(4, auto); grid-template-rows: repeat(3, auto); gap: 4px; justify-content: center; }
.nf { display: grid; grid-template-columns: repeat(3, var(--cs)); gap: 2px; padding: 3px; background: var(--cube-body); border-radius: 6px; }
.nfw[data-face="U"] { grid-area: 1 / 2; } .nfw[data-face="L"] { grid-area: 2 / 1; } .nfw[data-face="F"] { grid-area: 2 / 2; }
.nfw[data-face="R"] { grid-area: 2 / 3; } .nfw[data-face="B"] { grid-area: 2 / 4; } .nfw[data-face="D"] { grid-area: 3 / 2; }
.nfw { display: flex; flex-direction: column; gap: 3px; }
.nbar { display: flex; align-items: center; justify-content: space-between; }
.nbar button { width: calc(var(--cs) * .95); height: calc(var(--cs) * .95); padding: 0; border-radius: 50%; font-size: calc(var(--cs) * .62); line-height: 1; display: grid; place-items: center; }
.nbar button:not(:disabled) { border-color: var(--fg); }
.nbar span { font: 600 calc(var(--cs) * .5)/1 var(--font-mono); color: var(--muted); }
.cell {
  width: var(--cs); height: var(--cs); padding: 0; border: 0; border-radius: 3px; background: var(--tile);
  display: grid; place-items: center; font: 700 calc(var(--cs) * .56)/1 var(--font-display);
}
.cell.m1 { color: var(--x); } .cell.m2 { color: var(--o); }
.cell.hi { background: var(--tile-hi); }
.cell.hinted { background: var(--tile-hint); }
.cell.win { background: var(--win); color: #1a1e26; }
.cell.pending { box-shadow: inset 0 0 0 2px currentColor; }
.cell[data-label]:empty::after { content: attr(data-label); font: 500 calc(var(--cs) * .42)/1 var(--font-mono); color: var(--muted); opacity: .75; }
.cell:disabled, .cell.off { opacity: 1; cursor: default; }
.net { touch-action: none; user-select: none; -webkit-user-select: none; }
.net-caption { margin: 10px 0 0; font-size: 12px; color: var(--muted); text-align: center; }

/* Face turn pads */
.pads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pad { display: flex; align-items: center; justify-content: space-between; gap: 4px; border: 1px solid var(--line); border-radius: 12px; padding: 4px; background: var(--bg); }
.pad button { width: 34px; height: 34px; padding: 0; font-size: 18px; border-radius: 9px; background: var(--surface); flex: none; }
.pad .fl { text-align: center; font: 700 16px/1 var(--font-display); min-width: 0; }
.pad .fl small { display: block; font: 500 10px/1.2 var(--font-body); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
.turn-note { margin: 10px 0 0; font-size: 13px; color: var(--muted); min-height: 1.5em; }

.log { font: 13px/1.6 var(--font-mono); max-height: 132px; overflow-y: auto; margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.log li { white-space: nowrap; }
.log .n { color: var(--muted); }
.log .p1 { color: var(--x); } .log .p2 { color: var(--o); }
.log-empty { color: var(--muted); font-size: 13px; margin: 0; }

.rules { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 28px; }
@media (max-width: 760px) { .rules { grid-template-columns: minmax(0, 1fr); } }
.rules ol { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.rules li { max-width: 62ch; }
.rules p { margin: 0 0 8px; max-width: 62ch; }
.mono { font-family: var(--font-mono); font-size: .92em; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.puzzle-head { display: flex; align-items: center; gap: 14px; }
.puzzle-head .who { font: 600 18px/1.2 var(--font-display); }
.puzzle-head .sub { color: var(--muted); font-size: 13px; }
.dots { display: flex; gap: 6px; margin-top: 12px; }
.dot { width: 28px; height: 8px; border-radius: 4px; background: var(--line); }
.dot.on { background: var(--fg); }
.dot.done { background: var(--x); }
.dot.bad { background: var(--o); }
.feedback { margin: 12px 0 0; min-height: 1.5em; font-size: 14px; }
.feedback.good { color: var(--fg); }
.feedback.solved { font-weight: 600; }
.feedback.bad { color: var(--o); }
.me { display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
.me .big { font: 700 34px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.me .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.hist { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; font: 12px/1 var(--font-mono); }
.hist li { padding: 4px 6px; border-radius: 6px; }
.hist li.ok { background: color-mix(in srgb, var(--x) 16%, transparent); color: var(--fg); }
.hist li.no { background: color-mix(in srgb, var(--o) 18%, transparent); color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <section class="game">
    <div class="stage" id="stage">
      <div class="hint" id="hint">Drag a row to twist · drag the background to orbit</div>
      <button class="view-btn" id="resetView" type="button">Reset view</button>
    </div>

    <div class="rail">
      <div class="panel">
        <div class="puzzle-head">
          <div class="chip p1" id="chip">X</div>
          <div>
            <div class="who" id="pTitle">Loading puzzles…</div>
          </div>
        </div>
        <div class="dots" id="steps" aria-label="Moves in this puzzle"></div>
        <p class="feedback" id="feedback" role="status"></p>
        <div class="controls-row">
          <button type="button" id="next">Skip</button>
          <button type="button" id="reset" hidden>Reset</button>
          <button type="button" id="hintBtn" hidden>Hint</button>
          <button type="button" id="solBack" hidden>Back</button>
          <button type="button" id="solution" hidden>Show solution</button>
        </div>
      </div>


      <div class="panel">
        <h2>Unfolded cube</h2>
        <div class="net" id="net"></div>
        <p class="turn-note" id="turnNote"></p>
      </div>

      <div class="panel">
        <h2>Your rating</h2>
        <div class="me">
          <div><div class="big" id="myRating">1000</div><div class="lbl">puzzle rating</div></div>
          <div><div class="big" id="myCount">0</div><div class="lbl">attempted</div></div>
          <div><div class="big" id="myStreak">0</div><div class="lbl">streak</div></div>
          <button type="button" id="resetRating">Reset rating</button>
        </div>
        <ol class="hist" id="hist"></ol>
      </div>
    </div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = window.matchMedia && matchMedia("(hover: none)").matches;
/* ---------------- Geometry of the board ---------------- */
const V = {
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  mul: (a, k) => [a[0] * k, a[1] * k, a[2] * k],
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
  key: (a) => a.map((x) => (x === 0 ? 0 : x)).join(",")
};
const FACES = {
  U: { n: [0, 1, 0], r: [1, 0, 0], d: [0, 0, 1], name: "Up" },
  L: { n: [-1, 0, 0], r: [0, 0, 1], d: [0, -1, 0], name: "Left" },
  F: { n: [0, 0, 1], r: [1, 0, 0], d: [0, -1, 0], name: "Front" },
  R: { n: [1, 0, 0], r: [0, 0, -1], d: [0, -1, 0], name: "Right" },
  B: { n: [0, 0, -1], r: [-1, 0, 0], d: [0, -1, 0], name: "Back" },
  D: { n: [0, -1, 0], r: [1, 0, 0], d: [0, 0, -1], name: "Down" }
};
const ORDER = ["U", "L", "F", "R", "B", "D"];
const SLOTS = [];
const slotIndex = new Map();
ORDER.forEach((f) => {
  const { n, r, d } = FACES[f];
  for (let row = 0; row < 3; row++) for (let col = 0; col < 3; col++) {
    const p = V.add(V.add(n, V.mul(r, col - 1)), V.mul(d, row - 1));
    const i = SLOTS.length;
    SLOTS.push({ i, face: f, row, col, p, n });
    slotIndex.set(V.key(p) + "|" + V.key(n), i);
  }
});
function rotV(v, n, s) { return V.add(V.mul(V.cross(n, v), s), V.mul(n, V.dot(n, v))); }
// 12 twists: index = faceIndex*2 + (0 cw, 1 ccw). PERM[t][i] = where the mark on square i ends up.
const TWISTS = [];
ORDER.forEach((f) => ["cw", "ccw"].forEach((dir) => TWISTS.push({ face: f, dir })));
const PERM = TWISTS.map(({ face, dir }) => {
  const n = FACES[face].n, s = dir === "cw" ? -1 : 1;
  return SLOTS.map((sl) => V.dot(sl.p, n) !== 1 ? sl.i : slotIndex.get(V.key(rotV(sl.p, n, s)) + "|" + V.key(rotV(sl.n, n, s))));
});
const twistIndex = (face, dir) => ORDER.indexOf(face) * 2 + (dir === "cw" ? 0 : 1);
function inLayer(sl, f) { return V.dot(sl.p, FACES[f].n) === 1; }
const LINES = [];
ORDER.forEach((f, fi) => {
  const b = fi * 9;
  for (let k = 0; k < 3; k++) { LINES.push([b + k * 3, b + k * 3 + 1, b + k * 3 + 2]); LINES.push([b + k, b + k + 3, b + k + 6]); }
  LINES.push([b, b + 4, b + 8]); LINES.push([b + 2, b + 4, b + 6]);
});
const LINES_OF = SLOTS.map(() => []);
LINES.forEach((L, li) => L.forEach((c) => LINES_OF[c].push(li)));

/* ---------------- Rules engine (pure) ---------------- */
// A move is { slot, t }: place on `slot`, then apply twist t.
function newState() { return { cells: new Array(54).fill(0), turn: 1, last: null, winner: 0, winLines: [], draw: false, ply: 0 }; }
function twistCells(cells, t) { const p = PERM[t], nc = new Array(54); for (let i = 0; i < 54; i++) nc[p[i]] = cells[i]; return nc; }
function linesOf(cells, p) { const r = []; for (const L of LINES) if (cells[L[0]] === p && cells[L[1]] === p && cells[L[2]] === p) r.push(L); return r; }
function applyMove(s, mv) {
  const me = s.turn, opp = 3 - me;
  const placed = s.cells.slice(); placed[mv.slot] = me;
  const cells = twistCells(placed, mv.t);
  const t = { cells, turn: opp, last: { slot: mv.slot, t: mv.t, by: me, landed: PERM[mv.t][mv.slot] }, winner: 0, winLines: [], draw: false, ply: s.ply + 1 };
  const mine = linesOf(cells, me), theirs = linesOf(cells, opp);
  if (mine.length >= 2) { t.winner = me; t.winLines = mine; }
  else if (theirs.length >= 2) { t.winner = opp; t.winLines = theirs; }
  else if (cells.every((c) => c)) t.draw = true;
  return t;
}
const over = (s) => !!(s.winner || s.draw);

/* ---------------- Computer opponent ----------------
   Line values from the mover's view: completed lines persist and count toward the two needed. */
const VAL = (() => { const v = []; for (let a = 0; a <= 3; a++) { v.push([]); for (let b = 0; b <= 3; b++) {
  let x = 0;
  if (a === 3) x += 30; if (b === 3) x -= 34;
  if (b === 0 && a < 3) x += a === 2 ? 8 : a === 1 ? 1 : 0;
  if (a === 0 && b < 3) x -= b === 2 ? 10 : b === 1 ? 1 : 0;
  v[a].push(x); } } return v; })();
// Everything about the 648 replies of the side to move in one pass per twist.
// cb(slot, t, outcome, delta) with outcome +1 mover wins, -1 mover loses, 2 draw, 0 none, and delta
// the change in `me`'s evaluation (me = fixed viewpoint player) after that reply.
function scanMoves(cells, mover, me, cb) {
  const opp = 3 - mover, empty = []; for (let i = 0; i < 54; i++) if (!cells[i]) empty.push(i);
  for (let t = 0; t < 12; t++) {
    const tc = twistCells(cells, t);
    const ca = new Int8Array(48), cb2 = new Int8Array(48);   // counts for `me` and the other player
    let base = 0, fm = 0, fo = 0;
    for (let li = 0; li < 48; li++) {
      const L = LINES[li]; let a = 0, b = 0;
      for (const c of L) { if (tc[c] === me) a++; else if (tc[c]) b++; }
      ca[li] = a; cb2[li] = b; base += VAL[a][b];
      if (a === 3) { if (me === mover) fm++; else fo++; }
      if (b === 3) { if (me === mover) fo++; else fm++; }
    }
    for (const c of empty) {
      const p = PERM[t][c]; let delta = base, add = 0;
      for (const li of LINES_OF[p]) {
        const a = ca[li], b = cb2[li];
        if (mover === me) { delta += VAL[a + 1][b] - VAL[a][b]; if (a + 1 === 3) add++; }
        else { delta += VAL[a][b + 1] - VAL[a][b]; if (b + 1 === 3) add++; }
      }
      const out = fm + add >= 2 ? 1 : fo >= 2 ? -1 : empty.length === 1 ? 2 : 0;
      cb(c, t, out, delta);
    }
  }
}

/* ---------------- 3D scene ---------------- */
let renderer, scene, camera, root, pivot, bodyMat, raycaster, stage, canvas;
const bodies = [], stickers = [];
let layer = null;
const HOME = new THREE.Quaternion().setFromEuler(new THREE.Euler(0.52, -0.68, 0, "XYZ"));
const texCache = new Map();

function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function drawMark(g, m, alpha) {
  g.save(); g.globalAlpha = alpha; g.lineCap = "round"; g.lineWidth = 15;
  if (m === 1) { g.strokeStyle = "#2545c4"; g.beginPath(); g.moveTo(38, 38); g.lineTo(90, 90); g.moveTo(90, 38); g.lineTo(38, 90); g.stroke(); }
  else { g.strokeStyle = "#c8601a"; g.beginPath(); g.arc(64, 64, 28, 0, Math.PI * 2); g.stroke(); }
  g.restore();
}
// mark: committed or pending mark; ghost: hover preview; ring: outline (pending mark or last landed mark)
function tex(mark, ghost, win, ring) {
  const k = [mark, ghost, win ? 1 : 0, ring ? 1 : 0].join("");
  if (texCache.has(k)) return texCache.get(k);
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  g.fillStyle = win ? "#f0c43c" : "#f3f0e8"; roundRect(g, 2, 2, 124, 124, 18); g.fill();
  if (ring) { g.lineWidth = 5; g.strokeStyle = mark === 1 ? "rgba(37,69,196,.6)" : "rgba(200,96,26,.65)"; roundRect(g, 9, 9, 110, 110, 13); g.stroke(); }
  if (mark) drawMark(g, mark, 1); else if (ghost) drawMark(g, ghost, 0.32);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  texCache.set(k, t); return t;
}

    b.title = "Turn " + FACES[f].name + (dir === "cw" ? " clockwise" : " counterclockwise") + " (key " + f + (dir === "cw" ? "" : " with Shift") + ")";
    b.addEventListener("click", () => chooseTwist(f, dir));
    const on = () => { if (!canAct()) return; highlightFace = f; previewLayer(f, dir); renderStickers(); renderNet(); };
    const off = () => { highlightFace = null; clearPreview(); renderStickers(); renderNet(); };
    b.addEventListener("mouseenter", on); b.addEventListener("focus", on);
    b.addEventListener("mouseleave", off); b.addEventListener("blur", off);
    padButtons.push({ b, f, dir }); return b;
  };
  ORDER.forEach((f, fi) => {
    const wrap = document.createElement("div"); wrap.className = "nfw"; wrap.dataset.face = f;
    const bar = document.createElement("div"); bar.className = "nbar";
    const lab = document.createElement("span"); lab.textContent = f;
    bar.append(mk(f, "ccw"), lab, mk(f, "cw"));
    const nf = document.createElement("div"); nf.className = "nf"; nf.dataset.face = f;
    for (let k = 0; k < 9; k++) {
      const i = fi * 9 + k, b = document.createElement("button");
      b.type = "button"; b.className = "cell"; b.id = "cell-" + i;
      if (k === 4) b.dataset.label = f;
      b.setAttribute("aria-label", FACES[f].name + " face, square " + (k + 1));
      b.addEventListener("click", () => choosePlace(i));
      b.addEventListener("mouseenter", () => { if (canAct() && !shownCells()[i]) setHover(i); });
      b.addEventListener("mouseleave", () => setHover(-1));
      nf.appendChild(b); netCells.push(b);
    }
    wrap.append(bar, nf); net.appendChild(wrap);
  });
  bindNetSlide();
  $("next").addEventListener("click", pickPuzzle);
  $("reset").addEventListener("click", resetPuzzle);
  $("solution").addEventListener("click", () => {
    if (!P || busy || opponentBusy) return;
    if (!result) finish(false, "Solution viewed, counted as a miss.");
    showSolution();
  });
  $("hintBtn").addEventListener("click", showHint);
  $("solBack").addEventListener("click", () => solutionStep(-1));
  $("resetRating").addEventListener("click", () => {
    if ($("resetRating").dataset.armed) { profile = { rating: 1000, n: 0, streak: 0, history: [] }; saveProfile(); delete $("resetRating").dataset.armed; $("resetRating").textContent = "Reset rating"; render(); }
    else { $("resetRating").dataset.armed = "1"; $("resetRating").textContent = "Click again to reset"; }
  });
  $("hint").textContent = "Drag a row to twist · drag the background to orbit";
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const m = /^Key([UDLRFB])$/.exec(e.code);
    if (m && canAct()) { e.preventDefault(); chooseTwist(m[1], e.shiftKey ? "ccw" : "cw"); }
    if (e.key === "Escape" && pending >= 0 && canAct()) { pending = -1; render(); }
    else if (e.key === "Escape" && pendingTwist !== null && canAct()) { const t = pendingTwist ^ 1; chooseTwist(TWISTS[t].face, TWISTS[t].dir); }
    if (e.key === "n" && result) pickPuzzle();
    if (result === "viewing" && solSeq && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { e.preventDefault(); solutionStep(e.key === "ArrowRight" ? 1 : -1); }
  });
}
function winSet() { const s = new Set(); G.winLines.forEach((L) => L.forEach((i) => s.add(i))); return s; }
function renderStickers() {
  if (!stickers.length) return;
  const ws = winSet(), act = canAct(), cells = shownCells();
  stickers.forEach((m) => {
    const i = m.userData.slot, mark = cells[i];
    const ghost = !mark && act && pending < 0 && i === hoverSlot ? G.turn : 0;
    const map = tex(mark, ghost, ws.has(i), i === pending);
    if (m.material.map !== map) m.material.map = map;
    m.material.color.set(highlightFace && inLayer(SLOTS[i], highlightFace) ? 0xbfccff : hintFaces && hintFaces.has(SLOTS[i].face) ? 0xffe4a8 : 0xffffff);
  });
}
function renderNet() {
  const ws = winSet(), act = canAct(), cells = shownCells();
  netCells.forEach((b, i) => {
    const mark = cells[i], ghost = !mark && act && pending < 0 && i === hoverSlot;
    b.textContent = mark ? P_(mark) : ghost ? P_(G.turn) : "";
    b.style.opacity = ghost ? "0.55" : "";
    b.className = "cell" + (mark ? " m" + mark : ghost ? " m" + G.turn : "") + (ws.has(i) ? " win" : "") +
      (i === pending ? " pending" : "") + (highlightFace && inLayer(SLOTS[i], highlightFace) ? " hi" : hintFaces && hintFaces.has(SLOTS[i].face) ? " hinted" : "");
    const off = !act || !!cells[i]; b.classList.toggle("off", off); b.setAttribute("aria-disabled", String(off));
  });
}
function render() {
  renderStickers(); renderNet();
  $("myRating").textContent = Math.round(profile.rating);
  $("myCount").textContent = profile.n;
  $("myStreak").textContent = profile.streak;
  if (P) {
    $("chip").textContent = P_(me); $("chip").className = "chip p" + me;
    $("pTitle").textContent = (me === 1 ? "X" : "O") + " to play and win in " + P.d;
    const total = P.d;
    $("steps").innerHTML = Array.from({ length: total }, (_, k) => '<span class="dot' + (k < step ? (result === "failed" && k === step - 1 ? " bad" : " done") : k === step && !result ? " on" : "") + '"></span>').join("");
  }
  padButtons.forEach(({ b }) => { b.disabled = !canAct(); });
  $("turnNote").textContent = !P || result ? "" : opponentBusy ? "Opponent is replying." :
    pendingTwist !== null ? "Twisted " + FACES[TWISTS[pendingTwist].face].name + ". Now place your mark, or turn it back to undo." :
    pending >= 0 ? "Now twist: slide a row on the cube or the unfolded cube, or use the arrows. Tap your mark again to take it back." :
    "Place a mark and twist a face, in either order. Slide a row on the cube or the unfolded cube to twist.";
  const dirty = pending >= 0 || pendingTwist !== null || step > 0 || !!result || (result === "viewing" && solK > 0);
  $("reset").hidden = !P || !dirty || (result === "viewing" && (!solSeq || solK === 0)); $("reset").disabled = busy || opponentBusy;
  $("solution").hidden = !P || !(!result || result === "failed" || (result === "viewing" && solSeq));
  $("hintBtn").hidden = !P || !!result; $("hintBtn").disabled = busy || opponentBusy;
  $("solution").textContent = result === "viewing" && solSeq ? (solK < solSeq.length ? "Next move (" + (solK + 1) + "/" + solSeq.length + ")" : "End of solution") : "Show solution";
  $("solution").disabled = busy || opponentBusy || (result === "viewing" && solSeq && solK >= solSeq.length);
  $("solBack").hidden = !(result === "viewing" && solSeq); $("solBack").disabled = busy || !solSeq || solK === 0;
  $("next").textContent = result ? "Next puzzle" : "Skip";
  const h = $("hist"); h.innerHTML = "";
  profile.history.slice(0, 12).forEach((x) => { const li = document.createElement("li"); li.className = x.ok ? "ok" : "no"; li.title = "Puzzle " + x.id + " (" + x.rating + ")"; li.textContent = (x.delta >= 0 ? "+" : "") + x.delta; h.appendChild(li); });
  renderBoard();
}
function renderBoard() {
  if (!DATA || !$("board")) return;
  const rows = DATA.agents.map((a) => ({ name: a.name, rating: a.rating, pct: Math.round(100 * a.solved / a.n), you: false }));
  if (profile.n >= 5) rows.push({ name: "You", rating: Math.round(profile.rating), pct: Math.round(100 * profile.history.filter((x) => x.ok).length / Math.min(profile.history.length, 200)), you: true });
  rows.sort((a, b) => b.rating - a.rating);
  const tb = $("board"); tb.innerHTML = "";
  rows.forEach((r, k) => { const tr = document.createElement("tr"); if (r.you) tr.className = "you";
    tr.innerHTML = "<td>" + (k + 1) + "</td><td>" + r.name + "</td><td>" + r.rating + "</td><td>" + r.pct + "%</td>"; tb.appendChild(tr); });
}

function boot() {
  initScene(); buildDom(); render();
  fetch("tactics.json").then((r) => r.json()).then((d) => {
    DATA = d; pickPuzzle();
  }).catch(() => feedback("Could not load the puzzle set.", "bad"));
}
boot();

})();
</script>
